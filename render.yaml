# Render blueprint for the Oura connector.
#
# plan: starter, not free. A disk is required, and free instances have no
# persistent disk: the Oura login would be wiped on every restart and sleep,
# forcing re-consent from the phone repeatedly.
services:
  - type: web
    name: oura-mcp
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python oura_mcp.py
    healthCheckPath: /health
    disk:
      name: oura-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Generated by Render, then copied into the Claude connector header.
      # Never commit this value.
      - key: MCP_SECRET
        generateValue: true
      # sync: false means "prompt me, do not store in git".
      - key: OURA_CLIENT_ID
        sync: false
      - key: OURA_CLIENT_SECRET
        sync: false
      # This service's own https origin, e.g. https://oura-mcp.onrender.com
      # The Oura app's redirect URI must be exactly this plus /auth/callback
      - key: PUBLIC_URL
        sync: false
      - key: TOKEN_PATH
        value: /var/data/oura_tokens.json
